name: Validate Kestrel memory

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate contract, links, records, and skills
        run: python3 tools/validate_seed.py
      - name: Run validator regression tests
        run: python3 -m unittest discover -s tests -v
